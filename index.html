<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>Maison</title>
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="apple-mobile-web-app-title" content="Maison">
<link rel="apple-touch-icon" href="icone.png">
<style>
/* Blocs de couleur sur fond noir. Écrit pour Safari iOS 12 : pas de flex-gap, clamp(), inset, ni JS moderne. */
* { -webkit-box-sizing: border-box; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { height: 100%; margin: 0; }
body {
  background: #0a0a0a; color: #0a0a0a;
  font-family: "Helvetica Neue", Helvetica, Arial, sans-serif;
  font-size: 15px; line-height: 1.25;
  overflow: hidden; -webkit-user-select: none; user-select: none;
  -webkit-text-size-adjust: 100%; -webkit-font-smoothing: antialiased;
}
button { font: inherit; color: inherit; background: none; border: 0; padding: 0; margin: 0; cursor: pointer; text-align: left; }
a { color: inherit; text-decoration: none; }

#app {
  height: 100%; padding: 12px;
  display: grid;
  grid-template-columns: 272px minmax(0, 1fr) minmax(0, 1fr);
  grid-template-rows: minmax(0, 1fr) auto;
  grid-gap: 10px;
}
.col { display: grid; grid-template-columns: minmax(0, 1fr); grid-gap: 10px; min-height: 0; min-width: 0; }
#col-left { grid-template-rows: auto auto auto minmax(0, 1fr); }
#col-mid { grid-template-rows: auto minmax(0, 1fr); }
#col-right { grid-template-rows: minmax(0, 1fr) minmax(0, 1fr) minmax(0, 1fr); }

.panel { border-radius: 24px; min-height: 0; min-width: 0; overflow: hidden;
  display: -webkit-flex; display: flex; -webkit-flex-direction: column; flex-direction: column; }
.lilac { background: #b4a5dc; }
.olive { background: #a39a1c; }
.yellow { background: #fbec3a; }
.orange { background: #ff5b2e; }
.sage { background: #dfe9dc; }
.panel-head { padding: 14px 16px 10px; -webkit-flex: none; flex: none;
  display: -webkit-flex; display: flex; -webkit-align-items: center; align-items: center; }
.tag { display: inline-block; border: 1.5px solid #0a0a0a; border-radius: 99px; padding: 4px 13px 5px; font-size: 15px; font-weight: 500; letter-spacing: -0.01em; }
.head-note { margin-left: auto; font-size: 11px; opacity: 0.6; font-variant-numeric: tabular-nums; }
.scroll { -webkit-flex: 1 1 0; flex: 1 1 0; min-height: 0; overflow-y: auto; -webkit-overflow-scrolling: touch; }

/* Horloge, posée sur le noir */
#clock-panel { color: #f4f4ef; padding: 2px 4px 8px; min-width: 0; overflow: hidden; }
#clock { white-space: nowrap; font-size: 84px; font-weight: 500; line-height: 0.95; letter-spacing: -0.045em; font-variant-numeric: tabular-nums; }
#clock .sec { font-size: 20px; color: #77776f; margin-left: 6px; letter-spacing: 0; font-weight: 400; }
#date { margin-top: 6px; font-size: 22px; color: #77776f; letter-spacing: -0.01em; }
#date:first-letter { text-transform: uppercase; }

/* Météo */
#wx-now { padding: 0 16px 13px; display: -webkit-flex; display: flex; -webkit-align-items: flex-end; align-items: flex-end; }
#wx-main { min-width: 0; -webkit-flex: 1 1 0; flex: 1 1 0; }
#wx-temp { font-size: 60px; font-weight: 500; line-height: 0.95; letter-spacing: -0.04em; }
#wx-text { font-size: 19px; font-weight: 500; margin-top: 6px; letter-spacing: -0.01em; }
#wx-sub { font-size: 12px; opacity: 0.65; margin-top: 3px; }
#wx-icon { width: 62px; height: 62px; -webkit-flex: none; flex: none; margin-bottom: 30px; }
#wx-icon svg, .wx-day svg { width: 100%; height: 100%; display: block; }
#wx-days { -webkit-flex: 1 1 auto; flex: 1 1 auto; display: -webkit-flex; display: flex; -webkit-flex-direction: column; flex-direction: column; }
.wx-day { display: -webkit-flex; display: flex; -webkit-align-items: center; align-items: center; padding: 6px 16px; -webkit-flex: 1 1 auto; flex: 1 1 auto; }
.wx-day .d { width: 42px; font-size: 16px; font-weight: 500; text-transform: capitalize; }
.wx-day .i { width: 24px; height: 24px; margin-right: 10px; -webkit-flex: none; flex: none; }
.wx-day .bar { -webkit-flex: 1 1 0; flex: 1 1 0; height: 6px; position: relative; margin-right: 10px; }
.wx-day .bar:before { content: ""; position: absolute; left: 0; right: 0; top: 2.5px; height: 1px; background: #0a0a0a; }
.wx-day .bar b { position: absolute; top: 0; height: 6px; border-radius: 3px; background: #0a0a0a; }
.wx-day .t { width: 58px; text-align: right; font-variant-numeric: tabular-nums; font-weight: 500; white-space: nowrap; }
.wx-day .t .lo { opacity: 0.55; margin-left: 6px; font-weight: 400; }

/* Radios */
#stations { padding: 0 12px 14px; display: grid; grid-template-columns: 1fr 1fr; grid-gap: 7px; }
.station { display: block; width: 100%; border: 1.5px solid #0a0a0a; border-radius: 99px;
  padding: 10px 14px 11px; font-size: 16px; font-weight: 500; letter-spacing: -0.01em; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.station:active { background: rgba(10, 10, 10, 0.12); }
.station.on { background: #0a0a0a; color: #fbec3a; }

/* Lumières */
#hue-panel .panel-head { padding: 11px 16px 8px; }
#hue-off { margin-left: auto; font-size: 12px; text-decoration: underline; padding: 6px 0 6px 12px; }
#hue { padding: 0 12px 12px; }
#lamps { display: grid; grid-template-columns: 1fr 1fr; grid-gap: 6px; }
.lamp { display: block; width: 100%; border: 1.5px solid #0a0a0a; border-radius: 99px; padding: 8px 12px 9px;
  font-size: 15px; font-weight: 500; letter-spacing: -0.01em; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.lamp:active { background: rgba(10, 10, 10, 0.12); }
.lamp.on { background: #0a0a0a; color: #fbec3a; }
.hue-msg { padding: 0 4px 8px; font-size: 13px; line-height: 1.3; }
.hue-msg a { text-decoration: underline; }
.hue-btn { display: inline-block; background: #0a0a0a; color: #dfe9dc; border-radius: 99px; padding: 8px 15px 9px; font-size: 15px; font-weight: 500; }
#hue-ip { font: inherit; font-size: 16px; width: 150px; border: 1.5px solid #0a0a0a; border-radius: 99px; background: transparent; color: #0a0a0a;
  padding: 7px 12px; margin-right: 6px; -webkit-appearance: none; -webkit-user-select: text; user-select: text; }

/* Lien presse */
.pill-link { display: -webkit-flex; display: flex; -webkit-align-items: center; align-items: center; border-radius: 99px; padding: 6px 18px 6px 6px;
  font-size: 19px; font-weight: 500; letter-spacing: -0.015em; }
.pill-link:active { opacity: 0.8; }
.pill-link .ico { -webkit-flex: none; flex: none; width: 40px; height: 40px; border-radius: 50%; background: #0a0a0a; color: #fbec3a; margin-right: 12px;
  text-align: center; line-height: 40px; font-size: 19px; }
.pill-link .sub { margin-left: auto; font-size: 12px; opacity: 0.65; letter-spacing: 0; font-weight: 400; }

/* Podcasts */
.show { display: -webkit-flex; display: flex; -webkit-align-items: stretch; align-items: stretch; border-top: 1px solid rgba(10, 10, 10, 0.22); }
.show .main { -webkit-flex: 1 1 0; flex: 1 1 0; min-width: 0; padding: 9px 6px 10px 16px; }
.show .main:active, .show .more:active, .row:active, .news a:active, #back:active { background: rgba(10, 10, 10, 0.1); }
.show .nm { display: block; font-size: 18px; font-weight: 500; letter-spacing: -0.015em; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.show .ep { display: block; font-size: 13px; opacity: 0.72; margin-top: 2px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.show .when { -webkit-flex: none; flex: none; padding: 13px 0 0 6px; font-size: 11px; opacity: 0.65; white-space: nowrap; }
.show .more { -webkit-flex: none; flex: none; width: 42px; text-align: center; font-size: 22px; }
.show.on, .row.on { background: #0a0a0a; color: #ff5b2e; }
.show.off { opacity: 0.5; }
#back { display: block; width: 100%; padding: 10px 16px; border-top: 1px solid rgba(10, 10, 10, 0.22); font-weight: 500; font-size: 16px; -webkit-flex: none; flex: none; }
.row { display: block; width: 100%; padding: 10px 16px; border-top: 1px solid rgba(10, 10, 10, 0.22); }
.row .ttl { display: block; font-size: 16px; font-weight: 500; letter-spacing: -0.01em; }
.row .meta { display: block; font-size: 12px; opacity: 0.7; margin-top: 3px; }
.empty { padding: 14px 16px; opacity: 0.7; font-size: 14px; }

/* Actualités */
#col-right .panel-head { padding: 10px 14px 8px; }
#col-right .tag { font-size: 14px; padding: 3px 12px 4px; }
.news a { display: block; padding: 7px 16px 8px; border-top: 1px solid rgba(10, 10, 10, 0.16); }
.news .tm { display: block; font-size: 11px; opacity: 0.55; margin-bottom: 2px; font-variant-numeric: tabular-nums; }
.news .ttl { display: block; font-size: 15px; font-weight: 500; line-height: 1.22; letter-spacing: -0.012em; }

/* Lecteur */
#player { grid-column: 1 / 4; background: #b4a5dc; border-radius: 40px; padding: 8px 8px 8px 26px; position: relative; overflow: hidden;
  display: -webkit-flex; display: flex; -webkit-align-items: center; align-items: center; }
#pl-info { min-width: 0; -webkit-flex: 1 1 0; flex: 1 1 0; }
#pl-kind { font-size: 11px; font-weight: 500; letter-spacing: 0.12em; text-transform: uppercase; opacity: 0.7; }
#pl-kind.live { opacity: 1; }
#pl-title { font-size: 21px; font-weight: 500; letter-spacing: -0.02em; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
#pl-time { font-size: 13px; opacity: 0.7; margin: 0 12px; font-variant-numeric: tabular-nums; white-space: nowrap; }
.ctl { width: 46px; height: 46px; border-radius: 50%; border: 1.5px solid #0a0a0a; margin-left: 8px; font-size: 13px; font-weight: 500;
  text-align: center; -webkit-flex: none; flex: none; }
.ctl:active { background: rgba(10, 10, 10, 0.14); }
.ctl[disabled] { opacity: 0.3; }
#pl-play { width: 58px; height: 58px; background: #0a0a0a; color: #b4a5dc; border: 0; }
#pl-play svg { width: 22px; height: 22px; display: block; margin: 0 auto; }
#pl-bar { position: absolute; left: 0; right: 0; bottom: 0; height: 14px; }
#pl-bar i { position: absolute; left: 0; right: 0; bottom: 0; height: 4px; background: rgba(10, 10, 10, 0.18); }
#pl-fill { display: block; height: 100%; width: 0; background: #0a0a0a; }

@media (orientation: portrait) {
  body { overflow: auto; }
  #app { height: auto; grid-template-columns: minmax(0, 1fr); grid-template-rows: none; padding-bottom: 96px; }
  #player { grid-column: 1; position: fixed; left: 12px; right: 12px; bottom: 12px; }
  #col-mid .panel, #col-right .panel { max-height: 440px; }
  #col-left { grid-template-rows: auto auto auto auto; }
  #col-right { grid-template-rows: auto auto auto; }
  #hue-panel { max-height: 260px; }
}
</style>
</head>
<body>
<div id="app">

  <div class="col" id="col-left">
    <div id="clock-panel">
      <div id="clock">--:--</div>
      <div id="date">&nbsp;</div>
    </div>
    <div class="panel lilac" id="wx-card">
      <div class="panel-head"><span class="tag">Météo</span><span class="head-note" id="wx-city"></span></div>
      <div id="wx-now">
        <div id="wx-main">
          <div id="wx-temp">--°</div>
          <div id="wx-text">Chargement…</div>
          <div id="wx-sub"></div>
        </div>
        <div id="wx-icon"></div>
      </div>
    </div>
    <div class="panel lilac">
      <div id="wx-days"></div>
    </div>
    <div class="panel sage" id="hue-panel">
      <div class="panel-head"><span class="tag">Lumières</span><button id="hue-off" hidden>Tout éteindre</button></div>
      <div class="scroll" id="hue"></div>
    </div>
  </div>

  <div class="col" id="col-mid">
    <div class="panel yellow">
      <div class="panel-head"><span class="tag">Radio France</span><span class="head-note">en direct</span></div>
      <div id="stations"></div>
    </div>
    <div class="panel orange">
      <div class="panel-head"><span class="tag" id="pod-label">Podcasts</span><span class="head-note" id="pod-note">dernier épisode</span></div>
      <button id="back" hidden>← Tous les podcasts</button>
      <div class="scroll" id="pods"><div class="empty">Chargement…</div></div>
    </div>
  </div>

  <div class="col" id="col-right">
    <div class="panel sage">
      <div class="panel-head"><span class="tag" id="news-name-0">Le Monde</span><span class="head-note" id="news-note-0"></span></div>
      <div class="scroll news" id="news-0"><div class="empty">Chargement…</div></div>
    </div>
    <div class="panel sage">
      <div class="panel-head"><span class="tag" id="news-name-1">CNN</span><span class="head-note" id="news-note-1"></span></div>
      <div class="scroll news" id="news-1"><div class="empty">Chargement…</div></div>
    </div>
    <div class="panel sage">
      <div class="panel-head"><span class="tag" id="news-name-2">Le Film français</span><span class="head-note" id="news-note-2"></span></div>
      <div class="scroll news" id="news-2"><div class="empty">Chargement…</div></div>
    </div>
  </div>

  <div id="player">
    <div id="pl-bar" hidden><i><b id="pl-fill"></b></i></div>
    <div id="pl-info">
      <div id="pl-kind">Rien en lecture</div>
      <div id="pl-title">Choisis une radio ou un podcast</div>
    </div>
    <div id="pl-time"></div>
    <button class="ctl" id="pl-back" disabled>−30</button>
    <button class="ctl" id="pl-play" aria-label="Lecture ou pause"></button>
    <button class="ctl" id="pl-fwd" disabled>+30</button>
  </div>
</div>

<audio id="au" preload="none"></audio>

<script>
(function () {
  'use strict';

  function $(id) { return document.getElementById(id); }
  function esc(s) {
    return String(s == null ? '' : s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
  }
  function pad(n) { return n < 10 ? '0' + n : '' + n; }
  function get(url, cb) {
    var x = new XMLHttpRequest();
    x.open('GET', url, true);
    x.timeout = 30000;
    x.onreadystatechange = function () {
      if (x.readyState !== 4) { return; }
      var data = null;
      if (x.status === 200) { try { data = JSON.parse(x.responseText); } catch (e) { data = null; } }
      cb(data);
    };
    x.send(null);
  }
  function store(key, value) { try { window.localStorage.setItem(key, value); } catch (e) {} }
  function recall(key) { try { return window.localStorage.getItem(key); } catch (e) { return null; } }
  function closest(el, stop, attr) {
    while (el && el !== stop && !(el.getAttribute && el.getAttribute(attr) != null)) { el = el.parentNode; }
    return el && el !== stop ? el : null;
  }

  var DAYS = ['dimanche', 'lundi', 'mardi', 'mercredi', 'jeudi', 'vendredi', 'samedi'];
  var DAYS_SHORT = ['dim', 'lun', 'mar', 'mer', 'jeu', 'ven', 'sam'];
  var MONTHS = ['janvier', 'février', 'mars', 'avril', 'mai', 'juin', 'juillet', 'août', 'septembre', 'octobre', 'novembre', 'décembre'];
  var MONTHS_SHORT = ['janv.', 'févr.', 'mars', 'avr.', 'mai', 'juin', 'juil.', 'août', 'sept.', 'oct.', 'nov.', 'déc.'];

  var data = null, stations = [], pods = [];
  var current = null;      // {kind:'live'|'pod', id, show, title, sub, url}
  var wanted = false;      // l'utilisateur veut que ça joue
  var openShow = null;     // podcast dont on regarde la liste d'épisodes

  /* ---------- Horloge ---------- */
  function tick() {
    var n = new Date();
    $('clock').innerHTML = pad(n.getHours()) + ':' + pad(n.getMinutes()) + '<span class="sec">' + pad(n.getSeconds()) + '</span>';
    $('date').textContent = DAYS[n.getDay()] + ' ' + n.getDate() + (n.getDate() === 1 ? 'er ' : ' ') + MONTHS[n.getMonth()];
    // Rechargement discret chaque nuit pour repartir propre, sauf si on écoute quelque chose.
    if (n.getHours() === 4 && n.getMinutes() === 0 && n.getSeconds() === 0 && !wanted) { window.location.reload(); }
  }

  /* ---------- Météo ---------- */
  var S = '<svg viewBox="0 0 48 48" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round">';
  var CLOUD_HI = '<path d="M15 30h20a8 8 0 0 0 1-15.9A11 11 0 0 0 15 16a7 7 0 0 0 0 14z"/>';
  var ICONS = {
    sun: S + '<circle cx="24" cy="24" r="8"/><path d="M24 6v5M24 37v5M6 24h5M37 24h5M11.3 11.3l3.5 3.5M33.2 33.2l3.5 3.5M11.3 36.7l3.5-3.5M33.2 14.8l3.5-3.5"/></svg>',
    moon: S + '<path d="M36 28A14 14 0 0 1 20 12a14 14 0 1 0 16 16z"/></svg>',
    partly: S + '<circle cx="17" cy="17" r="6"/><path d="M17 5v3M5 17h3M8.5 8.5l2.1 2.1M25.5 8.5l-2.1 2.1"/><path d="M19 40h16a7 7 0 0 0 1-13.9A9.5 9.5 0 0 0 18 28a6 6 0 0 0 1 12z"/></svg>',
    cloud: S + '<path d="M15 36h20a8 8 0 0 0 1-15.9A11 11 0 0 0 15 22a7 7 0 0 0 0 14z"/></svg>',
    fog: S + CLOUD_HI + '<path d="M12 36h24M16 42h16"/></svg>',
    rain: S + CLOUD_HI + '<path d="M17 35l-2 6M25 35l-2 6M33 35l-2 6"/></svg>',
    snow: S + CLOUD_HI + '<path d="M16 37v.1M24 37v.1M32 37v.1M20 42v.1M28 42v.1" stroke-width="3.6"/></svg>',
    storm: S + CLOUD_HI + '<path d="M25 33l-5 7h7l-4 6"/></svg>'
  };
  function wx(code, isDay) {
    if (code === 0) { return [isDay ? 'sun' : 'moon', isDay ? 'Ensoleillé' : 'Ciel dégagé']; }
    if (code === 1) { return [isDay ? 'sun' : 'moon', 'Peu nuageux']; }
    if (code === 2) { return ['partly', 'Éclaircies']; }
    if (code === 3) { return ['cloud', 'Couvert']; }
    if (code === 45 || code === 48) { return ['fog', 'Brouillard']; }
    if (code >= 51 && code <= 57) { return ['rain', 'Bruine']; }
    if (code >= 61 && code <= 67) { return ['rain', code >= 65 ? 'Forte pluie' : 'Pluie']; }
    if (code >= 71 && code <= 77) { return ['snow', 'Neige']; }
    if (code >= 80 && code <= 82) { return ['rain', 'Averses']; }
    if (code === 85 || code === 86) { return ['snow', 'Averses de neige']; }
    if (code >= 95) { return ['storm', 'Orage']; }
    return ['cloud', 'Nuageux'];
  }
  // Du bleu (froid) à l'orange (chaud), en aplats.
  function tempColor(t) {
    if (t < 0) { return '#5e9cf5'; }
    if (t < 5) { return '#86b2f4'; }
    if (t < 10) { return '#a4aaec'; }
    if (t < 15) { return '#b4a5dc'; }
    if (t < 20) { return '#dfe9dc'; }
    if (t < 25) { return '#fbec3a'; }
    if (t < 30) { return '#ffa53a'; }
    return '#ff5b2e';
  }
  function paintWeather() {
    var d = data.weather;
    if (!d || !d.current) { $('wx-text').textContent = 'Météo indisponible'; return; }
    var n = new Date(), hm = pad(n.getHours()) + ':' + pad(n.getMinutes());
    var today = d.days[0] || {}, isDay = !today.rise || (hm >= today.rise && hm < today.set);
    var c = d.current, w = wx(c.code, isDay), i, html = '';
    $('wx-city').textContent = d.city || '';
    $('wx-card').style.background = tempColor(c.temp);
    $('wx-icon').innerHTML = ICONS[w[0]];
    $('wx-temp').textContent = Math.round(c.temp) + '°';
    $('wx-text').textContent = w[1];
    $('wx-sub').textContent = 'Ressenti ' + Math.round(c.feels) + '° · vent ' + Math.round(c.wind) + ' km/h' +
      (today.pop != null && today.pop >= 20 ? ' · pluie ' + today.pop + ' %' : '');
    var lo = 99, hi = -99;
    for (i = 0; i < d.days.length; i++) { lo = Math.min(lo, d.days[i].tmin); hi = Math.max(hi, d.days[i].tmax); }
    var span = Math.max(1, hi - lo);
    for (i = 0; i < d.days.length; i++) {
      var day = d.days[i], p = day.date.split('-'), dt = new Date(+p[0], +p[1] - 1, +p[2]), dw = wx(day.code, true);
      html += '<div class="wx-day" style="background:' + tempColor(day.tmax) + '"><span class="d">' + (i === 0 ? 'auj.' : DAYS_SHORT[dt.getDay()]) + '</span>' +
        '<span class="i">' + ICONS[dw[0]] + '</span>' +
        '<span class="bar"><b style="left:' + (100 * (day.tmin - lo) / span).toFixed(1) + '%;width:' +
        Math.max(4, 100 * (day.tmax - day.tmin) / span).toFixed(1) + '%"></b></span>' +
        '<span class="t">' + Math.round(day.tmax) + '°<span class="lo">' + Math.round(day.tmin) + '°</span></span></div>';
    }
    $('wx-days').innerHTML = html;
  }

  /* ---------- Dates ---------- */
  function hhmm(d) { return pad(d.getHours()) + ':' + pad(d.getMinutes()); }
  function dayLabel(ts) {
    if (!ts) { return ''; }
    var n = new Date(), d = new Date(ts * 1000);
    var days = Math.round((new Date(n.getFullYear(), n.getMonth(), n.getDate()) - new Date(d.getFullYear(), d.getMonth(), d.getDate())) / 86400000);
    if (days <= 0) { return 'auj.'; }
    if (days === 1) { return 'hier'; }
    if (days < 7) { return DAYS_SHORT[d.getDay()] + '.'; }
    return d.getDate() + ' ' + MONTHS_SHORT[d.getMonth()];
  }
  function ago(ts) {
    if (!ts) { return ''; }
    var n = new Date(), d = new Date(ts * 1000), mins = Math.round((n - d) / 60000);
    if (mins < 1) { return 'à l\'instant'; }
    if (mins < 60) { return 'il y a ' + mins + ' min'; }
    if (d.toDateString() === n.toDateString()) { return hhmm(d); }
    return dayLabel(ts) + ' ' + hhmm(d);
  }

  /* ---------- Actualités ---------- */
  function paintNews() {
    var i, j, html, src;
    for (i = 0; i < 3 && i < data.news.length; i++) {
      src = data.news[i];
      $('news-name-' + i).textContent = src.name;
      if (!src.items.length) { $('news-' + i).innerHTML = '<div class="empty">Titres indisponibles pour le moment.</div>'; continue; }
      html = '';
      for (j = 0; j < src.items.length; j++) {
        html += '<a href="' + esc(src.items[j].link) + '" target="_blank" rel="noopener"><span class="tm">' + ago(src.items[j].ts) +
          '</span><span class="ttl">' + esc(src.items[j].title) + '</span></a>';
      }
      $('news-' + i).innerHTML = html;
    }
  }
  function paintFreshness() {
    var late = !data || (new Date().getTime() / 1000 - data.updated) > 3 * 3600;
    var txt = late && data ? 'données du ' + dayLabel(data.updated) + ' ' + hhmm(new Date(data.updated * 1000)) : '';
    $('news-note-0').textContent = txt;
  }

  /* ---------- Lecteur ---------- */
  var au = $('au');
  var retries = 0, retryTimer = null;
  var PLAY = '<svg viewBox="0 0 24 24" fill="currentColor"><path d="M7 4l14 8-14 8z"/></svg>';
  var PAUSE = '<svg viewBox="0 0 24 24" fill="currentColor"><path d="M6 4h4v16H6zM14 4h4v16h-4z"/></svg>';

  function clock(s) {
    if (!isFinite(s) || s < 0) { return '0:00'; }
    s = Math.floor(s);
    var h = Math.floor(s / 3600), m = Math.floor((s % 3600) / 60), r = s % 60;
    return (h ? h + ':' + pad(m) : m) + ':' + pad(r);
  }
  function paintPlayer() {
    var isPod = !!current && current.kind === 'pod';
    $('pl-play').innerHTML = wanted ? PAUSE : PLAY;
    $('pl-back').disabled = !isPod;
    $('pl-fwd').disabled = !isPod;
    $('pl-bar').hidden = !isPod;
    if (!current) { return; }
    $('pl-kind').className = current.kind === 'live' && wanted ? 'live' : '';
    $('pl-kind').textContent = current.kind === 'live' ? (wanted ? '● En direct' : 'En pause') : current.sub;
    $('pl-title').textContent = current.title;
    if (!isPod) { $('pl-time').textContent = ''; }
    paintStations();
    paintPods();
  }
  function start() {
    if (!current) { return; }
    wanted = true;
    window.clearTimeout(retryTimer);
    if (current.kind === 'live' || au.getAttribute('src') !== current.url) {
      au.setAttribute('src', current.url);   // un direct se recharge à chaque fois : on repart du présent
      au.load();
    }
    var p = au.play();
    if (p && p['catch']) { p['catch'](function () {}); }
    paintPlayer();
  }
  function pause() {
    wanted = false;
    window.clearTimeout(retryTimer);
    au.pause();
    if (current && current.kind === 'live') { au.removeAttribute('src'); au.load(); }
    paintPlayer();
  }
  function playStation(st) {
    current = { kind: 'live', id: st.id, title: st.name, sub: '', url: st.url };
    store('station', st.id);
    retries = 0;
    start();
  }
  function playEpisode(pod, ep) {
    current = { kind: 'pod', id: ep.audio, show: pod.id, title: ep.title, sub: pod.name, url: ep.audio };
    retries = 0;
    start();
  }
  function toggleEpisode(pod, ep) {
    if (current && current.kind === 'pod' && current.id === ep.audio) { if (wanted) { pause(); } else { start(); } }
    else { playEpisode(pod, ep); }
  }
  function retry() {
    if (!wanted || !current || current.kind !== 'live' || retries >= 20) { return; }
    retries++;
    window.clearTimeout(retryTimer);
    retryTimer = window.setTimeout(start, 4000);
  }
  au.addEventListener('playing', function () { retries = 0; });
  au.addEventListener('error', function () {
    if (!wanted || !current) { return; }
    if (current.kind === 'live') { $('pl-kind').textContent = 'Reconnexion…'; retry(); }
    else { $('pl-kind').textContent = 'Lecture impossible'; wanted = false; $('pl-play').innerHTML = PLAY; }
  });
  au.addEventListener('ended', function () {
    if (current && current.kind === 'live') { retry(); } else { wanted = false; paintPlayer(); }
  });
  au.addEventListener('pause', function () {
    // Pause venue d'ailleurs (casque, centre de contrôle) : on aligne le bouton.
    if (wanted && au.paused && !au.ended && current && current.kind === 'pod') { wanted = false; paintPlayer(); }
  });
  au.addEventListener('timeupdate', function () {
    if (!current || current.kind !== 'pod') { return; }
    var d = au.duration;
    $('pl-time').textContent = clock(au.currentTime) + (isFinite(d) && d > 0 ? ' / ' + clock(d) : '');
    $('pl-fill').style.width = (isFinite(d) && d > 0 ? (100 * au.currentTime / d) : 0) + '%';
  });
  $('pl-play').onclick = function () {
    if (!current) {
      var last = recall('station'), i, pick = stations[0];
      for (i = 0; i < stations.length; i++) { if (stations[i].id === last) { pick = stations[i]; } }
      if (pick) { playStation(pick); }
      return;
    }
    if (wanted) { pause(); } else { start(); }
  };
  function seek(delta) {
    if (!current || current.kind !== 'pod' || !isFinite(au.duration)) { return; }
    try { au.currentTime = Math.max(0, Math.min(au.duration - 1, au.currentTime + delta)); } catch (e) {}
  }
  $('pl-back').onclick = function () { seek(-30); };
  $('pl-fwd').onclick = function () { seek(30); };
  $('pl-bar').onclick = function (e) {
    if (!current || current.kind !== 'pod' || !isFinite(au.duration)) { return; }
    var r = this.getBoundingClientRect();
    try { au.currentTime = au.duration * Math.max(0, Math.min(1, (e.clientX - r.left) / r.width)); } catch (err) {}
  };

  /* ---------- Radios ---------- */
  function paintStations() {
    var html = '', i, st, on;
    for (i = 0; i < stations.length; i++) {
      st = stations[i];
      on = current && current.kind === 'live' && current.id === st.id && wanted;
      html += '<button class="station' + (on ? ' on' : '') + '" data-i="' + i + '">' + esc(st.name) + '</button>';
    }
    $('stations').innerHTML = html;
  }
  $('stations').onclick = function (e) {
    var t = closest(e.target, this, 'data-i');
    if (!t) { return; }
    var st = stations[+t.getAttribute('data-i')];
    if (current && current.kind === 'live' && current.id === st.id && wanted) { pause(); } else { playStation(st); }
  };

  /* ---------- Podcasts ---------- */
  function findPod(id) {
    for (var i = 0; i < pods.length; i++) { if (pods[i].id === id) { return pods[i]; } }
    return null;
  }
  function paintPods() {
    var html = '', i, p, ep, meta, d, pod = openShow ? findPod(openShow) : null;
    $('back').hidden = !pod;
    $('pod-label').textContent = pod ? pod.name : 'Podcasts';
    $('pod-note').textContent = pod ? '' : 'dernier épisode';
    if (pod) {
      for (i = 0; i < pod.episodes.length; i++) {
        ep = pod.episodes[i];
        d = ep.ts ? new Date(ep.ts * 1000) : null;
        meta = (d ? d.getDate() + ' ' + MONTHS[d.getMonth()] : '') + (ep.dur ? (d ? ' · ' : '') + Math.max(1, Math.round(ep.dur / 60)) + ' min' : '');
        html += '<button class="row' + (current && current.kind === 'pod' && current.id === ep.audio ? ' on' : '') + '" data-ep="' + i + '">' +
          '<span class="ttl">' + esc(ep.title) + '</span><span class="meta">' + esc(meta) + '</span></button>';
      }
      $('pods').innerHTML = html;
      return;
    }
    for (i = 0; i < pods.length; i++) {
      p = pods[i];
      ep = p.episodes[0];
      if (!ep) {
        html += '<div class="show off"><div class="main"><span class="nm">' + esc(p.name) + '</span><span class="ep">Indisponible pour le moment</span></div></div>';
        continue;
      }
      html += '<div class="show' + (current && current.kind === 'pod' && current.show === p.id ? ' on' : '') + '">' +
        '<button class="main" data-play="' + i + '"><span class="nm">' + esc(p.name) + '</span><span class="ep">' + esc(ep.title) + '</span></button>' +
        '<span class="when">' + dayLabel(ep.ts) + '</span>' +
        '<button class="more" data-open="' + i + '" aria-label="Tous les épisodes">→</button></div>';
    }
    $('pods').innerHTML = html || '<div class="empty">Aucun podcast.</div>';
  }
  $('pods').onclick = function (e) {
    var t, pod;
    if ((t = closest(e.target, this, 'data-open'))) {
      openShow = pods[+t.getAttribute('data-open')].id;
      paintPods();
      this.scrollTop = 0;
    } else if ((t = closest(e.target, this, 'data-play'))) {
      pod = pods[+t.getAttribute('data-play')];
      toggleEpisode(pod, pod.episodes[0]);
    } else if ((t = closest(e.target, this, 'data-ep'))) {
      pod = findPod(openShow);
      toggleEpisode(pod, pod.episodes[+t.getAttribute('data-ep')]);
    }
  };
  $('back').onclick = function () { openShow = null; paintPods(); };

  /* ---------- Lumières (Philips Hue, pont sur le réseau de la maison) ---------- */
  var hue = null, lamps = [], hueStep = 'idle', hueIp = '', hueNote = '';
  try { hue = JSON.parse(recall('hue') || 'null'); } catch (e) { hue = null; }
  function hx(method, url, body, cb) {
    var x = new XMLHttpRequest(), done = false;
    function end(v) { if (!done) { done = true; cb(v); } }
    try { x.open(method, url, true); } catch (e) { end(null); return; }
    x.timeout = 8000;
    x.onreadystatechange = function () {
      if (x.readyState !== 4) { return; }
      var d = null;
      try { d = JSON.parse(x.responseText); } catch (e) { d = null; }
      end(x.status === 200 ? d : null);
    };
    try { x.send(body ? JSON.stringify(body) : null); } catch (e) { end(null); }
  }
  function hueUrl(path) { return 'http://' + hue.ip + '/api/' + hue.user + path; }
  function paintHue() {
    var html = '', i;
    $('hue-off').hidden = !(hue && lamps.length);
    if (window.location.protocol === 'https:') {
      var plain = 'http://' + window.location.host + window.location.pathname;
      $('hue').innerHTML = '<div class="hue-msg">Pour piloter les lampes, ouvre le dashboard à cette adresse : <a href="' + esc(plain) + '">' + esc(plain) + '</a></div>';
      return;
    }
    if (!hue) {
      if (hueStep === 'idle') {
        html = '<button class="hue-btn" data-hue="find">Connecter le pont Hue</button>';
      } else if (hueStep === 'find') {
        html = '<div class="hue-msg">Recherche du pont…</div>';
      } else if (hueStep === 'ip') {
        html = '<div class="hue-msg">Pont introuvable. Tape son adresse IP (app Hue, Réglages, Mon pont) :</div>' +
          '<input id="hue-ip" type="text" inputmode="decimal" placeholder="192.168.1.20" autocomplete="off" autocorrect="off">' +
          '<button class="hue-btn" data-hue="ip">OK</button>';
      } else {
        html = '<div class="hue-msg">Appuie sur le bouton rond du pont Hue, puis touche Continuer.</div>' +
          '<button class="hue-btn" data-hue="pair">Continuer</button>';
      }
      if (hueNote) { html = '<div class="hue-msg"><b>' + esc(hueNote) + '</b></div>' + html; }
      $('hue').innerHTML = html;
      return;
    }
    if (!lamps.length) { $('hue').innerHTML = '<div class="hue-msg">' + esc(hueNote || 'Chargement…') + '</div>'; return; }
    html = '<div id="lamps">';
    for (i = 0; i < lamps.length; i++) {
      html += '<button class="lamp' + (lamps[i].on ? ' on' : '') + '" data-lamp="' + i + '">' + esc(lamps[i].name) + '</button>';
    }
    $('hue').innerHTML = html + '</div>';
  }
  function loadLamps() {
    if (!hue || window.location.protocol === 'https:') { return; }
    hx('GET', hueUrl('/groups'), null, function (d) {
      var id, list = [];
      if (!d) { if (!lamps.length) { hueNote = 'Pont Hue injoignable.'; paintHue(); } return; }
      if (d.length && d[0] && d[0].error) {      // accès révoqué : on repart de zéro
        hue = null; lamps = []; hueStep = 'idle'; hueNote = ''; store('hue', 'null'); paintHue(); return;
      }
      for (id in d) {
        if (d.hasOwnProperty(id) && d[id] && (d[id].type === 'Room' || d[id].type === 'Zone')) {
          list.push({ id: id, name: d[id].name, on: !!(d[id].state && d[id].state.any_on) });
        }
      }
      list.sort(function (a, b) { return a.name < b.name ? -1 : a.name > b.name ? 1 : 0; });
      lamps = list;
      hueNote = list.length ? '' : 'Aucune pièce trouvée sur le pont.';
      paintHue();
    });
  }
  function huePair() {
    hx('POST', 'http://' + hueIp + '/api', { devicetype: 'maison#ipad' }, function (d) {
      if (d && d[0] && d[0].success && d[0].success.username) {
        hue = { ip: hueIp, user: d[0].success.username };
        store('hue', JSON.stringify(hue));
        hueNote = ''; lamps = [];
        paintHue(); loadLamps();
      } else if (d && d[0] && d[0].error) {
        hueNote = 'Bouton pas encore pressé. Appuie dessus et réessaie.'; paintHue();
      } else {
        hueNote = 'Pas de réponse du pont à ' + hueIp + '.'; hueStep = 'ip'; paintHue();
      }
    });
  }
  $('hue').onclick = function (e) {
    var t = closest(e.target, this, 'data-hue'), act, lamp;
    if (t) {
      act = t.getAttribute('data-hue');
      hueNote = '';
      if (act === 'find') {
        hueStep = 'find'; paintHue();
        hx('GET', 'https://discovery.meethue.com/', null, function (d) {
          if (d && d[0] && d[0].internalipaddress) { hueIp = d[0].internalipaddress; hueStep = 'press'; }
          else { hueStep = 'ip'; }
          paintHue();
        });
      } else if (act === 'ip') {
        hueIp = $('hue-ip').value.replace(/[^0-9.:]/g, '');
        if (hueIp) { hueStep = 'press'; } else { hueNote = 'Adresse vide.'; }
        paintHue();
      } else if (act === 'pair') { huePair(); }
      return;
    }
    t = closest(e.target, this, 'data-lamp');
    if (!t || !hue) { return; }
    lamp = lamps[+t.getAttribute('data-lamp')];
    lamp.on = !lamp.on;
    paintHue();
    hx('PUT', hueUrl('/groups/' + lamp.id + '/action'), { on: lamp.on }, function () { window.setTimeout(loadLamps, 1500); });
  };
  $('hue-off').onclick = function () {
    if (!hue) { return; }
    for (var i = 0; i < lamps.length; i++) { lamps[i].on = false; }
    paintHue();
    hx('PUT', hueUrl('/groups/0/action'), { on: false }, function () { window.setTimeout(loadLamps, 1500); });
  };

  /* ---------- Données ---------- */
  function load() {
    get('data.json?t=' + new Date().getTime(), function (d) {
      if (!d || !d.updated) {
        if (!data) { window.setTimeout(load, 15000); }
        return;
      }
      if (data && data.updated === d.updated) { paintFreshness(); return; }
      data = d;
      stations = d.stations || [];
      pods = d.podcasts || [];
      paintStations();
      paintPods();
      paintWeather();
      paintNews();
      paintFreshness();
    });
  }

  // hidden n'a pas de style par défaut fiable partout : on le garantit ici.
  var css = document.createElement('style');
  css.appendChild(document.createTextNode('[hidden]{display:none !important}'));
  document.head.appendChild(css);

  $('pl-play').innerHTML = PLAY;
  tick();
  window.setInterval(tick, 1000);
  load();
  paintHue();
  loadLamps();
  window.setInterval(loadLamps, 20 * 1000);
  window.setInterval(load, 5 * 60 * 1000);
  window.setInterval(function () { if (data) { paintNews(); } }, 60 * 1000);
}());
</script>
</body>
</html>

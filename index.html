<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>Maison</title>
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="apple-mobile-web-app-title" content="Maison">
<link rel="apple-touch-icon" href="icone.png">
<style>
/*
  Trois dispositions, choisies par le script selon la taille et l'orientation de l'écran :
  - m-grid  : grand écran (iPad paysage, ordinateur). Vue d'ensemble en trois colonnes ; toucher un titre
              déploie la section en grand, les autres se rangent dans une colonne de raccourcis.
  - m-rail  : téléphone à l'horizontale. Toujours une colonne de raccourcis + une section ouverte.
  - m-stack : téléphone à la verticale. Sections empilées qui se déplient une à la fois.
  Écrit pour fonctionner aussi sur Safari iOS 12 : pas de gap en flexbox, ni min()/max()/clamp(), ni JS moderne.
*/
@font-face { font-family: "Montserrat"; font-weight: 300; src: url(fonts/montserrat-latin-300-normal.woff2) format("woff2"), url(fonts/montserrat-latin-300-normal.woff) format("woff"); }
@font-face { font-family: "Montserrat"; font-weight: 400; src: url(fonts/montserrat-latin-400-normal.woff2) format("woff2"), url(fonts/montserrat-latin-400-normal.woff) format("woff"); }
@font-face { font-family: "Montserrat"; font-weight: 500; src: url(fonts/montserrat-latin-500-normal.woff2) format("woff2"), url(fonts/montserrat-latin-500-normal.woff) format("woff"); }
@font-face { font-family: "Montserrat"; font-weight: 700; src: url(fonts/montserrat-latin-700-normal.woff2) format("woff2"), url(fonts/montserrat-latin-700-normal.woff) format("woff"); }

* { -webkit-box-sizing: border-box; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { height: 100%; margin: 0; }
body {
  background: #262626; color: #0c0c0c;
  font-family: "Montserrat", "Avenir Next", "Helvetica Neue", Helvetica, Arial, sans-serif;
  font-size: 14px; line-height: 1.25;
  -webkit-user-select: none; user-select: none;
  -webkit-text-size-adjust: 100%; -webkit-font-smoothing: antialiased;
  display: -webkit-flex; display: flex; -webkit-flex-direction: column; flex-direction: column;
  overflow: hidden;
}
button { font: inherit; color: inherit; background: none; border: 0; padding: 0; margin: 0; cursor: pointer; text-align: left; touch-action: manipulation; }
a { color: inherit; text-decoration: none; }
svg { display: block; width: 100%; height: 100%; }

/* ---------- Structure ---------- */
#view { -webkit-flex: 1 1 0; flex: 1 1 0; min-height: 0; padding: 10px; padding-left: calc(10px + env(safe-area-inset-left)); padding-right: calc(10px + env(safe-area-inset-right));
  display: -webkit-flex; display: flex; }
#cols, #rail, #main, #stack { display: none; min-width: 0; min-height: 0; }
.col { -webkit-flex: 1 1 0; flex: 1 1 0; min-width: 0; min-height: 0; margin-left: 10px;
  display: -webkit-flex; display: flex; -webkit-flex-direction: column; flex-direction: column; overflow-y: auto; -webkit-overflow-scrolling: touch; }
#c1 { -webkit-flex: 0 0 268px; flex: 0 0 268px; margin-left: 0; }

.sec { border-radius: 8px; overflow: hidden; min-width: 0; min-height: 0; -webkit-flex: 0 0 auto; flex: 0 0 auto;
  display: -webkit-flex; display: flex; -webkit-flex-direction: column; flex-direction: column; }
.sec + .sec { margin-top: 10px; }
.orange { background: #f5821f; }
.stone { background: #b7b7b1; }
.paper { background: #dededa; }
.sage { background: #7f8a70; }
.brown { background: #80574a; }
.sand { background: #c3b083; }
.slate { background: #555555; color: #e9e9e4; }

.sec-head { -webkit-flex: none; flex: none; width: 100%; min-height: 52px; padding: 8px 12px 8px 14px;
  display: -webkit-flex; display: flex; -webkit-align-items: center; align-items: center; }
.sec-head:active { background: rgba(12, 12, 12, 0.1); }
.sec-head .ic { -webkit-flex: none; flex: none; width: 24px; height: 24px; margin-right: 12px; }
.st { -webkit-flex: 1 1 0; flex: 1 1 0; min-width: 0; }
.tt { display: block; font-size: 17px; font-weight: 700; line-height: 1.1; letter-spacing: -0.01em; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.sm { display: block; font-style: normal; font-size: 12px; font-weight: 500; opacity: 0.6; margin-top: 2px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.go { -webkit-flex: none; flex: none; width: 32px; height: 32px; margin-left: 8px; padding: 7px; border-radius: 6px; background: rgba(12, 12, 12, 0.12); }
.go .x { display: none; }
.sec-body { min-height: 0; display: -webkit-flex; display: flex; -webkit-flex-direction: column; flex-direction: column; -webkit-flex: 0 0 auto; flex: 0 0 auto; }
.scroll { min-height: 0; }
/* Une section « fill » remplit la place qu'on lui donne et fait défiler son contenu. */
.sec.fill { -webkit-flex: 1 1 0; flex: 1 1 0; }
.sec.fill .sec-body { -webkit-flex: 1 1 0; flex: 1 1 0; }
.sec.fill .scroll { -webkit-flex: 1 1 0; flex: 1 1 0; overflow-y: auto; -webkit-overflow-scrolling: touch; }
.sec.mini .sec-body { display: none; }

/* ---------- Grand écran : vue d'ensemble ---------- */
.m-grid.overview #cols { display: -webkit-flex; display: flex; -webkit-flex: 1 1 0; flex: 1 1 0; }
.m-grid.overview #s-clock .sec-head { display: none; }

/* ---------- Section déployée + colonne de raccourcis (grand écran et téléphone horizontal) ---------- */
.focus #rail { display: -webkit-flex; display: flex; -webkit-flex-direction: column; flex-direction: column; -webkit-flex: 0 0 250px; flex: 0 0 250px;
  overflow-y: auto; -webkit-overflow-scrolling: touch; margin-right: 10px; }
.focus #main { display: -webkit-flex; display: flex; -webkit-flex-direction: column; flex-direction: column; -webkit-flex: 1 1 0; flex: 1 1 0; }
#rail .sec + .sec { margin-top: 6px; }
#rail .sec-head { min-height: 50px; padding-top: 6px; padding-bottom: 6px; }
#rail .go { display: none; }
#main .go .o { display: none; }
#main .go .x { display: block; }
#main .sec-head { min-height: 60px; }
#main .tt { font-size: 22px; }
#main .sm { font-size: 13px; }
.m-rail #rail { -webkit-flex-basis: 200px; flex-basis: 200px; }
.m-rail #rail .sec-head { min-height: 46px; }
.m-rail #main .sec-head { min-height: 48px; }
.m-rail #main .tt { font-size: 18px; }
.m-rail #main .go { display: none; }

/* ---------- Téléphone vertical : sections empilées qui se déplient ---------- */
.m-stack { overflow: visible; display: block; height: auto; }
html.m-stack-html { height: auto; }
.m-stack #view { display: block; padding-bottom: 96px; padding-bottom: calc(96px + env(safe-area-inset-bottom)); }
.m-stack #stack { display: block; }
.m-stack .sec + .sec { margin-top: 8px; }
.m-stack .sec-head { min-height: 58px; }
.m-stack .go { background: none; padding: 6px; -webkit-transition: -webkit-transform 0.15s; transition: transform 0.15s; }
.m-stack .sec.open .go { -webkit-transform: rotate(90deg); transform: rotate(90deg); }
.m-stack #s-clock .sec-head { display: none; }
.m-stack #player { position: fixed; left: 0; right: 0; bottom: 0; z-index: 5; margin: 0; border-radius: 0; padding-bottom: 7px; padding-bottom: calc(7px + env(safe-area-inset-bottom)); }

/* ---------- Horloge ---------- */
#clock-body { padding: 8px 12px 12px; }
#clock { display: block; width: 100%; white-space: nowrap; text-align: right; font-size: 72px; font-weight: 300; line-height: 1; letter-spacing: -0.04em; font-variant-numeric: tabular-nums; }
#clock .sec2 { font-size: 18px; font-weight: 400; letter-spacing: 0; opacity: 0.55; margin-left: 4px; }
#date { margin: 12px 2px 10px; font-size: 19px; font-weight: 700; line-height: 1.1; letter-spacing: -0.01em; }
#date:before { content: ""; display: inline-block; width: 13px; height: 13px; border-radius: 50%; background: #0c0c0c; margin-right: 7px; }
#date span { display: block; color: #b25c10; }
#chrono { display: -webkit-flex; display: flex; }
#ch-main { -webkit-flex: 1 1 0; flex: 1 1 0; min-width: 0; height: 44px; border-radius: 6px; background: #d87118; padding: 0 10px;
  display: -webkit-flex; display: flex; -webkit-align-items: center; align-items: center; }
#ch-main .ic { -webkit-flex: none; flex: none; margin: 0 8px 0 0; width: 20px; height: 20px; }
#ch-time { font-size: 22px; font-weight: 500; letter-spacing: -0.02em; font-variant-numeric: tabular-nums; }
#ch-state { margin-left: auto; font-size: 11px; font-weight: 700; opacity: 0.7; }
#ch-main.run { background: #0c0c0c; color: #f5821f; }
#ch-reset { -webkit-flex: none; flex: none; width: 44px; height: 44px; margin-left: 5px; border-radius: 6px; background: #d87118; text-align: center; font-size: 20px; font-weight: 700; }
#ch-main:active, #ch-reset:active { opacity: 0.75; }
#main #clock { text-align: center; font-size: 150px; }
#main #clock .sec2 { font-size: 34px; }
#main #date { font-size: 28px; text-align: center; margin: 20px 0; }
#main #date:before { display: none; }
#main #chrono { max-width: 420px; width: 100%; margin: 0 auto; }
.m-rail #main #clock { font-size: 84px; }
.m-rail #main #date { font-size: 20px; margin: 8px 0 10px; }

/* ---------- Météo ---------- */
#wx-now { padding: 0 14px 6px; display: -webkit-flex; display: flex; -webkit-align-items: flex-end; align-items: flex-end; -webkit-flex: none; flex: none; }
#wx-main { min-width: 0; -webkit-flex: 1 1 0; flex: 1 1 0; }
#wx-text { font-size: 14px; font-weight: 700; }
#wx-sub { font-size: 11px; opacity: 0.65; margin-top: 2px; }
#wx-temp { -webkit-flex: none; flex: none; font-size: 58px; font-weight: 300; line-height: 0.95; letter-spacing: -0.04em; }
#wx-days { padding: 8px 12px 12px; display: -webkit-flex; display: flex; height: 126px; -webkit-flex: none; flex: none; }
.wcol { -webkit-flex: 1 1 0; flex: 1 1 0; min-width: 0; text-align: center; font-size: 11px;
  display: -webkit-flex; display: flex; -webkit-flex-direction: column; flex-direction: column; -webkit-align-items: center; align-items: center; }
.wcol .hi { font-weight: 700; font-size: 12px; }
.wcol .track { -webkit-flex: 1 1 0; flex: 1 1 0; width: 30px; margin: 4px 0; border-radius: 6px; background: rgba(12, 12, 12, 0.17); position: relative; display: block; }
.wcol .track b { position: absolute; left: 0; right: 0; border-radius: 6px; background: #0c0c0c; }
.wcol .lo { opacity: 0.65; }
.wcol .wi { width: 20px; height: 20px; margin-top: 3px; }
.wcol .dn { opacity: 0.65; text-transform: capitalize; }
#main #wx-now { padding: 4px 20px 10px; }
#main #wx-temp { font-size: 110px; }
#main #wx-text { font-size: 22px; }
#main #wx-sub { font-size: 14px; }
#main #wx-days { -webkit-flex: 1 1 0; flex: 1 1 0; height: auto; min-height: 150px; max-height: 340px; padding: 14px 20px 20px; }
#main .wcol { font-size: 14px; }
#main .wcol .hi { font-size: 16px; }
#main .wcol .track { width: 46px; }
#main .wcol .wi { width: 30px; height: 30px; }
.m-rail #main #wx-temp { font-size: 64px; }
.m-rail #main #wx-days { min-height: 120px; }
.m-stack #wx-days { height: 160px; }

/* ---------- Tuiles : radios et lumières ---------- */
#radio-body, #hue-body { padding: 0 6px 6px; }
#stations { display: grid; grid-gap: 5px; grid-template-columns: repeat(auto-fill, minmax(60px, 1fr)); }
.tile { display: block; width: 100%; background: #dededa; color: #0c0c0c; border-radius: 6px; text-align: center; font-weight: 700; letter-spacing: -0.01em; overflow: hidden; position: relative; }
.tile:active { background: #f0f0ec; }
#stations .tile { height: 48px; padding: 0 4px; font-size: 11px; line-height: 1.1; display: -webkit-flex; display: flex; -webkit-align-items: center; align-items: center; -webkit-justify-content: center; justify-content: center; }
#stations .tile.on { background: #f5821f; }
#stations .tile.ko { opacity: 0.45; }
/* Logos officiels, affichés en noir et blanc ; le blanc de leur fond se fond dans la tuile. */
.logo { display: block; max-width: 84%; max-height: 34px; -webkit-filter: grayscale(1) contrast(1.15); filter: grayscale(1) contrast(1.15); mix-blend-mode: multiply; pointer-events: none; }
#main #stations, .m-stack #stations { grid-template-columns: repeat(auto-fill, minmax(96px, 1fr)); grid-gap: 6px; }
#main #stations .tile, .m-stack #stations .tile { height: 68px; font-size: 13px; }
#main .logo, .m-stack .logo { max-height: 46px; max-width: 78%; }
.m-rail #main #stations { grid-template-columns: repeat(auto-fill, minmax(84px, 1fr)); }
.m-rail #main #stations .tile { height: 56px; }
.m-rail #main .logo { max-height: 38px; }
#radio-tools { display: none; padding: 10px 4px 4px; font-size: 12px; line-height: 1.35; }
#main #radio-tools, .m-stack #radio-tools { display: block; }
.btn { display: inline-block; background: #0c0c0c; color: #dededa; border-radius: 6px; padding: 0 14px; min-height: 44px; line-height: 44px; font-size: 13px; font-weight: 700; }
.btn:active { opacity: 0.8; }
#radio-result { margin-top: 8px; }

#lamps { display: grid; grid-template-columns: 1fr 1fr; grid-gap: 5px; }
.lamp { height: 44px; padding: 0 8px; font-size: 13px; white-space: nowrap; text-overflow: ellipsis; background: #a3a39d; color: #3a3a37; }
.lamp.on { background: #f3f3ef; color: #0c0c0c; }
.lamp.all { background: #555555; color: #dededa; }
#main #lamps, .m-stack #lamps { grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); grid-gap: 6px; }
#main .lamp, .m-stack .lamp { height: 60px; font-size: 15px; }
.msg { padding: 0 8px 8px; font-size: 12px; line-height: 1.35; }
.msg a { text-decoration: underline; }
#hue-ip { font: inherit; font-size: 16px; width: 150px; height: 44px; border: 0; border-radius: 6px; background: #dededa; color: #0c0c0c;
  padding: 0 10px; margin: 0 6px 6px 8px; -webkit-appearance: none; -webkit-user-select: text; user-select: text; }
#hue .btn { margin-left: 8px; }

/* ---------- Listes : podcasts, Spotify, actualités ---------- */
.line { border-top: 1px solid rgba(12, 12, 12, 0.3); }
.show { display: -webkit-flex; display: flex; -webkit-align-items: stretch; align-items: stretch; }
.show .main { -webkit-flex: 1 1 0; flex: 1 1 0; min-width: 0; min-height: 52px; padding: 8px 6px 9px 14px; }
.show .main:active, .show .more:active, .row:active, .news a:active, #back:active { background: rgba(12, 12, 12, 0.12); }
.show .nm { display: block; font-size: 14px; font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.show .nm:before { content: "\25B6\FE0E"; font-size: 9px; margin-right: 8px; vertical-align: 2px; }
.show .ep { display: block; font-size: 12px; opacity: 0.75; margin-top: 2px; padding-left: 17px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.show .when { -webkit-flex: none; flex: none; padding: 9px 0 0 6px; font-size: 12px; font-weight: 700; white-space: nowrap; }
.show .more { -webkit-flex: none; flex: none; width: 48px; text-align: center; font-size: 18px; font-weight: 700; }
.show.on, .row.on { background: #0c0c0c; color: #f5821f; }
.show.off { opacity: 0.5; }
#back { display: block; width: 100%; min-height: 46px; padding: 0 14px; font-weight: 700; -webkit-flex: none; flex: none; }
.row { display: block; width: 100%; min-height: 48px; padding: 9px 14px; }
.row .ttl { display: block; font-size: 14px; font-weight: 700; }
.row .meta { display: block; font-size: 12px; opacity: 0.75; margin-top: 3px; }
.empty { padding: 10px 14px; opacity: 0.75; font-size: 13px; }
#main .show .nm, #main .row .ttl { font-size: 16px; }
#main .show .ep, #main .row .meta { font-size: 13px; }
#main .show .main { min-height: 60px; padding-top: 11px; padding-bottom: 12px; }

.news a { display: block; padding: 7px 14px 8px; border-top: 1px solid rgba(12, 12, 12, 0.2); }
.news .tm { display: block; font-size: 10px; font-weight: 700; opacity: 0.5; margin-bottom: 2px; font-variant-numeric: tabular-nums; }
.news .ttl { display: block; font-size: 13.5px; font-weight: 500; line-height: 1.25; }
#main .news a, .m-stack .news a { padding: 11px 16px 12px; }
#main .news .ttl { font-size: 18px; }
#main .news .tm { font-size: 12px; }
.m-stack .news .ttl, .m-rail #main .news .ttl { font-size: 15px; }

#sp-now { -webkit-flex: none; flex: none; padding: 0 14px 12px; }
#sp-now .empty { padding: 0; }
.sp-track { font-size: 16px; font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.sp-artist { font-size: 13px; opacity: 0.78; margin-top: 2px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.sp-ctl { display: -webkit-flex; display: flex; margin-top: 10px; }
.sp-ctl button { -webkit-flex: 1 1 0; flex: 1 1 0; height: 48px; border-radius: 6px; background: rgba(12, 12, 12, 0.35); margin-right: 5px; padding: 14px 0; }
.sp-ctl button:last-child { margin-right: 0; }
.sp-ctl button:active { opacity: 0.7; }
.sp-ctl .pp { background: #0c0c0c; color: #f5821f; }
.sp-ctl svg { width: 20px; height: 20px; margin: 0 auto; }
.sp-dev { display: block; width: 100%; min-height: 44px; font-size: 12px; opacity: 0.9; text-decoration: underline; }
.sp-help { font-size: 12px; line-height: 1.35; opacity: 0.9; margin-top: 10px; }
.sp-share { margin-top: 6px; font-size: 12px; line-height: 1.35; }
.sp-share img { display: block; width: 180px; height: 180px; background: #fff; border-radius: 6px; margin-bottom: 8px; }
.sp-link { margin-top: 6px; word-break: break-all; -webkit-user-select: text; user-select: text; background: rgba(12, 12, 12, 0.3); border-radius: 6px; padding: 8px; }
.slate .line { border-top-color: rgba(233, 233, 228, 0.18); }
.slate .btn { background: #f5821f; color: #0c0c0c; }

/* ---------- Lecteur ---------- */
#player { -webkit-flex: none; flex: none; margin: 0 10px 10px; margin-left: calc(10px + env(safe-area-inset-left)); margin-right: calc(10px + env(safe-area-inset-right));
  background: #555555; color: #e6e6e1; border-radius: 8px; padding: 7px 7px 7px 16px; position: relative; overflow: hidden;
  display: -webkit-flex; display: flex; -webkit-align-items: center; align-items: center; }
#pl-info { min-width: 0; -webkit-flex: 1 1 0; flex: 1 1 0; }
#pl-kind { font-size: 11px; font-weight: 700; opacity: 0.6; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
#pl-kind.live { opacity: 1; color: #f5821f; }
#pl-title { font-size: 18px; font-weight: 700; letter-spacing: -0.01em; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
#pl-time { font-size: 13px; opacity: 0.7; margin: 0 10px; font-variant-numeric: tabular-nums; white-space: nowrap; }
.ctl { width: 50px; height: 50px; border-radius: 6px; background: #6b6b6b; margin-left: 5px; font-size: 13px; font-weight: 700; text-align: center; -webkit-flex: none; flex: none; }
.ctl:active { background: #7a7a7a; }
.ctl[disabled] { opacity: 0.35; }
#pl-play { width: 64px; background: #f5821f; color: #0c0c0c; padding: 14px 0; }
#pl-play svg { width: 22px; height: 22px; margin: 0 auto; }
#pl-bar { position: absolute; left: 0; right: 0; top: 0; height: 14px; }
#pl-bar i { position: absolute; left: 0; right: 0; top: 0; height: 4px; background: #3d3d3d; }
#pl-fill { display: block; height: 100%; width: 0; background: #f5821f; }
.m-stack #pl-title, .m-rail #pl-title { font-size: 15px; }
.m-stack .ctl[disabled], .m-rail .ctl[disabled] { display: none; }
.m-stack #pl-time { display: none; }
.m-rail .ctl { height: 44px; }
.m-rail #player { margin-bottom: 6px; padding-top: 5px; padding-bottom: 5px; }
.m-rail #view { padding-top: 6px; padding-bottom: 6px; }
</style>
</head>
<body class="m-grid overview">
<div id="view">
  <div id="cols"><div class="col" id="c1"></div><div class="col" id="c2"></div><div class="col" id="c3"></div></div>
  <div id="rail"></div>
  <div id="main"></div>
  <div id="stack"></div>

  <div id="pool" hidden>
    <div class="sec orange" id="s-clock" data-sec="clock">
      <button class="sec-head" data-head="clock"><span class="ic" data-ic="clock"></span><span class="st"><b class="tt">Horloge</b><i class="sm" id="sum-clock">&nbsp;</i></span><span class="go"><span class="o" data-ic="chev"></span><span class="x" data-ic="close"></span></span></button>
      <div class="sec-body" id="clock-body">
        <button id="clock" data-head="clock" aria-label="Agrandir l'horloge">--:--</button>
        <div id="date">&nbsp;</div>
        <div id="chrono">
          <button id="ch-main" aria-label="Chronomètre : démarrer ou arrêter"><span class="ic" data-ic="timer"></span><span id="ch-time">00:00,0</span><span id="ch-state">Démarrer</span></button>
          <button id="ch-reset" aria-label="Remettre le chronomètre à zéro">↺</button>
        </div>
      </div>
    </div>

    <div class="sec stone" id="s-weather" data-sec="weather">
      <button class="sec-head" data-head="weather"><span class="ic" id="wx-icon"></span><span class="st"><b class="tt">Météo</b><i class="sm" id="sum-weather">Chargement…</i></span><span class="go"><span class="o" data-ic="chev"></span><span class="x" data-ic="close"></span></span></button>
      <div class="sec-body">
        <div id="wx-now">
          <div id="wx-main"><div id="wx-text">&nbsp;</div><div id="wx-sub"></div></div>
          <div id="wx-temp">--°</div>
        </div>
        <div id="wx-days"></div>

          for (i = 0; i < SP.devices.length; i++) { if (dev && SP.devices[i].id === dev.id) { next = SP.devices[(i + 1) % SP.devices.length]; } }
          if (next && dev && next.id !== dev.id) { sp('PUT', '/me/player', { device_ids: [next.id], play: true }, spDone); }
          paintSp();
        });
      }
      return;
    }
    t = closest(e.target, this, 'data-list');
    if (t && SP.lists) { spPlay({ context_uri: SP.lists[+t.getAttribute('data-list')].uri }); }
  };
  window.afterLayout = function () { if (open === 'spotify') { spOpen(); } };
  // Connexion reçue d'un autre appareil : #sp=… dans l'adresse.
  (function () {
    var m = /^#sp=(.+)$/.exec(window.location.hash);
    if (!m) { return; }
    try { window.history.replaceState(null, '', window.location.pathname); } catch (e) { window.location.hash = ''; }
    SP.tok = { access: '', refresh: decodeURIComponent(m[1]), exp: 0 };
    store('spotify', JSON.stringify(SP.tok));
    open = 'spotify';
  }());
  // Retour de la page d'autorisation Spotify : ?code=… dans l'adresse.
  (function () {
    var m = /[?&]code=([^&]+)/.exec(window.location.search), denied = /[?&]error=/.test(window.location.search);
    if (!m && !denied) { return; }
    try { window.history.replaceState(null, '', window.location.pathname); } catch (e) {}
    open = 'spotify';
    if (!m) { SP.note = 'Autorisation refusée.'; return; }
    spToken({ grant_type: 'authorization_code', code: decodeURIComponent(m[1]), redirect_uri: spHere(),
      client_id: SP.cid, code_verifier: recall('sp_verifier') || '' }, function (ok) {
      SP.note = ok ? '' : 'La connexion à Spotify a échoué. Réessaie.';
      setOpen('spotify');
      spOpen();
    });
  }());

  /* ---------- Lumières (Philips Hue, pont sur le réseau de la maison) ---------- */
  var hue = null, lamps = [], hueStep = 'idle', hueIp = '', hueNote = '';
  try { hue = JSON.parse(recall('hue') || 'null'); } catch (e) { hue = null; }
  function hx(method, url, body, cb) {
    var x = new XMLHttpRequest(), done = false;
    function end(v) { if (!done) { done = true; cb(v); } }
    try { x.open(method, url, true); } catch (e) { end(null); return; }
    x.timeout = 8000;
    x.onreadystatechange = function () {
      if (x.readyState !== 4) { return; }
      var d = null;
      try { d = JSON.parse(x.responseText); } catch (e) { d = null; }
      end(x.status === 200 ? d : null);
    };
    try { x.send(body ? JSON.stringify(body) : null); } catch (e) { end(null); }
  }
  // Page en https : on parle au pont en https aussi (il faut avoir accepté son certificat une fois dans Safari).
  var HUE_SCHEME = window.location.protocol === 'https:' ? 'https://' : 'http://';
  function hueUrl(path) { return HUE_SCHEME + hue.ip + '/api/' + hue.user + path; }
  function paintHue() {
    var html = '', i, lit = 0;
    if (!hue) {
      if (hueStep === 'idle') {
        html = '<button class="btn" data-hue="find">Connecter le pont Hue</button>';
      } else if (hueStep === 'find') {
        html = '<div class="msg">Recherche du pont…</div>';
      } else if (hueStep === 'ip') {
        html = '<div class="msg">Pont introuvable. Tape son adresse IP (app Hue, Réglages, Mon pont) :</div>' +
          '<input id="hue-ip" type="text" inputmode="decimal" placeholder="192.168.1.20" autocomplete="off" autocorrect="off">' +
          '<button class="btn" data-hue="ip">OK</button>';
      } else {
        html = (HUE_SCHEME === 'https://' ? '<div class="msg">1. Touche <a href="https://' + esc(hueIp) + '/api/config" target="_blank" rel="noopener">ce lien</a>, ' +
          'puis « Afficher les détails » et « consulter ce site web ». Reviens ici.</div>' : '') +
          '<div class="msg">' + (HUE_SCHEME === 'https://' ? '2. ' : '') + 'Appuie sur le bouton rond du pont Hue, puis touche Continuer.</div>' +
          '<button class="btn" data-hue="pair">Continuer</button>';
      }
      if (hueNote) { html = '<div class="msg"><b>' + esc(hueNote) + '</b></div>' + html; }
      $('hue').innerHTML = html;
      sum('lights', 'Philips Hue · non connecté');
      return;
    }
    if (!lamps.length) { $('hue').innerHTML = '<div class="msg">' + esc(hueNote || 'Chargement…') + '</div>'; sum('lights', hueNote || 'Philips Hue'); return; }
    html = '<div id="lamps">';
    for (i = 0; i < lamps.length; i++) {
      if (lamps[i].on) { lit++; }
      html += '<button class="tile lamp' + (lamps[i].on ? ' on' : '') + '" data-lamp="' + i + '">' + esc(lamps[i].name) + '</button>';
    }
    $('hue').innerHTML = html + '<button class="tile lamp all" data-lamp="all">Tout éteindre</button></div>';
    sum('lights', lit ? lit + (lit > 1 ? ' pièces allumées' : ' pièce allumée') : 'tout est éteint');
  }
  function loadLamps() {
    if (!hue) { return; }
    hx('GET', hueUrl('/groups'), null, function (d) {
      var id, list = [];
      if (!d) { if (!lamps.length) { hueNote = 'Pont Hue injoignable.'; paintHue(); } return; }
      if (d.length && d[0] && d[0].error) {      // accès révoqué : on repart de zéro
        hue = null; lamps = []; hueStep = 'idle'; hueNote = ''; store('hue', 'null'); paintHue(); return;
      }
      for (id in d) {
        if (d.hasOwnProperty(id) && d[id] && (d[id].type === 'Room' || d[id].type === 'Zone')) {
          list.push({ id: id, name: d[id].name, on: !!(d[id].state && d[id].state.any_on) });
        }
      }
      list.sort(function (a, b) { return a.name < b.name ? -1 : a.name > b.name ? 1 : 0; });
      lamps = list;
      hueNote = list.length ? '' : 'Aucune pièce trouvée sur le pont.';
      paintHue();
    });
  }
  function huePair() {
    hx('POST', HUE_SCHEME + hueIp + '/api', { devicetype: 'maison#ipad' }, function (d) {
      if (d && d[0] && d[0].success && d[0].success.username) {
        hue = { ip: hueIp, user: d[0].success.username };
        store('hue', JSON.stringify(hue));
        hueNote = ''; lamps = [];
        paintHue(); loadLamps();
      } else if (d && d[0] && d[0].error) {
        hueNote = 'Bouton pas encore pressé. Appuie dessus et réessaie.'; paintHue();
      } else {
        hueNote = 'Pas de réponse du pont à ' + hueIp + (HUE_SCHEME === 'https://' ? '. As-tu accepté l\'avertissement de l\'étape 1 ?' : '.'); paintHue();
      }
    });
  }
  $('hue').onclick = function (e) {
    var t = closest(e.target, this, 'data-hue'), act, key, lamp, i;
    if (t) {
      act = t.getAttribute('data-hue');
      hueNote = '';
      if (act === 'find') {
        hueStep = 'find'; paintHue();
        hx('GET', 'https://discovery.meethue.com/', null, function (d) {
          if (d && d[0] && d[0].internalipaddress) { hueIp = d[0].internalipaddress; hueStep = 'press'; }
          else { hueStep = 'ip'; }
          paintHue();
        });
      } else if (act === 'ip') {
        hueIp = $('hue-ip').value.replace(/[^0-9.:]/g, '');
        if (hueIp) { hueStep = 'press'; } else { hueNote = 'Adresse vide.'; }
        paintHue();
      } else if (act === 'pair') { huePair(); }
      return;
    }
    t = closest(e.target, this, 'data-lamp');
    if (!t || !hue) { return; }
    key = t.getAttribute('data-lamp');
    if (key === 'all') {
      for (i = 0; i < lamps.length; i++) { lamps[i].on = false; }
      paintHue();
      hx('PUT', hueUrl('/groups/0/action'), { on: false }, function () { window.setTimeout(loadLamps, 1500); });
      return;
    }
    lamp = lamps[+key];
    lamp.on = !lamp.on;
    paintHue();
    hx('PUT', hueUrl('/groups/' + lamp.id + '/action'), { on: lamp.on }, function () { window.setTimeout(loadLamps, 1500); });
  };

  /* ---------- Données ---------- */
  function load() {
    get('data.json?t=' + new Date().getTime(), function (d) {
      if (!d || !d.updated) {
        if (!data) { window.setTimeout(load, 15000); }
        return;
      }
      if (data && data.updated === d.updated) { return; }
      data = d;
      if (d.spotify && d.spotify !== SP.cid) { SP.cid = d.spotify; store('sp_cid', SP.cid); if (open === 'spotify') { spOpen(); } else { paintSp(); } }
      stations = d.stations || [];
      pods = d.podcasts || [];
      paintStations();
      paintPods();
      paintWeather();
      paintNews();
    });
  }

  // hidden n'a pas de style par défaut fiable partout : on le garantit ici.
  var css = document.createElement('style');
  css.appendChild(document.createTextNode('[hidden]{display:none !important}'));
  document.head.appendChild(css);

  var marks = document.querySelectorAll('[data-ic]'), k;
  for (k = 0; k < marks.length; k++) { marks[k].innerHTML = PICTOS[marks[k].getAttribute('data-ic')]; }

  $('pl-play').innerHTML = PLAY;
  chronoSync();
  tick();
  paintSp();
  paintHue();
  layout(true);
  window.setInterval(tick, 1000);
  load();
  loadLamps();
  window.setInterval(spPoll, 5000);
  window.setInterval(loadLamps, 20 * 1000);
  window.setInterval(load, 5 * 60 * 1000);
  window.setInterval(function () { if (data) { paintNews(); } }, 60 * 1000);
}());
</script>
</body>
</html>
